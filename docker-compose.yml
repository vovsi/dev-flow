services:
  app:
    build: .
    ports:
      # Только loopback: у приложения нет авторизации, и порт на 0.0.0.0 отдавал бы всей
      # локальной сети доступ к задачам, Jira-действиям и запросам к нейронке
      - "127.0.0.1:8000:8000"
    volumes:
      # Весь проект смонтирован с хоста — правки кода подхватываются без пересборки образа
      - .:/app
      # settings.json Claude Code (десктопное приложение) — для тумблера уведомлений в разделе
      # «Claude» настроек (см. [claude] в config/params.ini). ${HOME} — это хост, не контейнер,
      # поэтому путь не завязан на конкретного пользователя. Смонтирован только сам файл, а не
      # весь ~/.claude — там же токены MCP и история сессий, доступ к ним приложению не нужен.
      - ${HOME}/.claude/settings.json:/claude/settings.json
